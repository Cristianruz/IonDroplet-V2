<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Colores</title><style>
  body{font-family:system-ui;background:#F6F7F4;color:#1A2E1A;margin:0;padding:32px}
  h1{font-size:26px;margin:0 0 20px}
  .fila{display:flex;flex-wrap:wrap;gap:16px}
  .sw{width:150px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,.05);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .sw .c{height:80px}
  .sw .t{padding:10px 12px;font-size:15px}
  .sw .t b{display:block;font-size:16px}
  .sw .t code{color:#5C6B5C;font-size:13px}
</style></head><body>
<h1>Paleta IonDroplet</h1>
<div class="fila">
  <div class="sw"><div class="c" style="background:#2E7D32"></div><div class="t"><b>Verde</b><code>#2E7D32</code> marca / positivo</div></div>
  <div class="sw"><div class="c" style="background:#1B5E20"></div><div class="t"><b>Verde fuerte</b><code>#1B5E20</code> bordes / hover</div></div>
  <div class="sw"><div class="c" style="background:#0277BD"></div><div class="t"><b>Agua</b><code>#0277BD</code> riego / humedad</div></div>
  <div class="sw"><div class="c" style="background:#B45309"></div><div class="t"><b>Alerta</b><code>#B45309</code> tierra seca</div></div>
  <div class="sw"><div class="c" style="background:#B91C1C"></div><div class="t"><b>Peligro</b><code>#B91C1C</code> detener / sin conexión</div></div>
  <div class="sw"><div class="c" style="background:#B8860B"></div><div class="t"><b>Oro</b><code>#B8860B</code> ionización</div></div>
  <div class="sw"><div class="c" style="background:#1A2E1A"></div><div class="t"><b>Tinta</b><code>#1A2E1A</code> texto</div></div>
  <div class="sw"><div class="c" style="background:#5C6B5C"></div><div class="t"><b>Tinta suave</b><code>#5C6B5C</code> texto secundario</div></div>
  <div class="sw"><div class="c" style="background:#F6F7F4;border-bottom:1px solid #eee"></div><div class="t"><b>Fondo</b><code>#F6F7F4</code> fondo general</div></div>
</div>
</body></html>
