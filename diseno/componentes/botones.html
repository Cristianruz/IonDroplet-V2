<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Botones</title><style>
  body{font-family:system-ui;background:#F6F7F4;color:#1A2E1A;margin:0;padding:32px;display:flex;flex-direction:column;gap:18px;max-width:480px}
  .rol{color:#5C6B5C;font-size:14px;text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
  button{font-family:inherit;border-radius:16px;font-weight:800;cursor:pointer;min-height:60px}
  .primario{background:#0277BD;color:#fff;border:none;font-size:26px;padding:24px}
  .peligro{background:#B91C1C;color:#fff;border:none;font-size:26px;padding:24px}
  .toggleOn{background:#2E7D32;color:#fff;border:4px solid #1B5E20;font-size:20px;padding:16px}
  .toggleOff{background:#fff;color:#5C6B5C;border:4px solid #D6DDD6;font-size:20px;padding:16px}
  .oro{background:#B8860B;color:#fff;border:4px solid #8A6508;font-size:20px;padding:16px}
</style></head><body>
<div class="rol">Acción principal (60px+ de alto, para dedos con tierra)</div>
<button class="primario">💧 REGAR AHORA</button>
<div class="rol">Acción de peligro</div>
<button class="peligro">⏹ DETENER RIEGO</button>
<div class="rol">Selector activo / inactivo</div>
<button class="toggleOn">✨ Solo (automático)</button>
<button class="toggleOff">✋ Yo decido</button>
<div class="rol">Ionización encendida</div>
<button class="oro">⚡ ENCENDIDA — Tocar para apagar</button>
</body></html>
